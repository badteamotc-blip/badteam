services:
  - type: web
    name: bad-team-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python pay.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: bot-data
      mountPath: /var/data
      sizeGB: 1
